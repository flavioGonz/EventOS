<!doctype html><html lang="es"><head><meta charset="utf-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:;"/>
<style>
  :root{--acc:#3b82f6;--acc2:#22d3ee;--txt:#e6edf6;--dim:#8a97a8}
  *{margin:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:radial-gradient(120% 120% at 50% 0%,#101827 0%,#0a0d12 60%);color:#e6edf6;
    font-family:Segoe UI,system-ui,Arial,sans-serif;display:grid;place-items:center;overflow:hidden;user-select:none}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:22px;animation:rise .7s cubic-bezier(.2,.8,.2,1)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .mark{width:132px;height:132px;filter:drop-shadow(0 6px 22px rgba(59,130,246,.35))}
  .ring{fill:none;stroke:rgba(255,255,255,.10);stroke-width:2}
  .sweep-g{transform-origin:66px 66px;animation:spin 1.9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pulse{fill:none;stroke:var(--acc);stroke-width:2;transform-origin:66px 66px;animation:pl 2.2s ease-out infinite}
  @keyframes pl{0%{transform:scale(.35);opacity:.8}80%{transform:scale(1.15);opacity:0}100%{opacity:0}}
  .brand{font-size:26px;font-weight:800;letter-spacing:.5px}
  .brand b{color:var(--acc2)}
  .sub{font-size:12.5px;color:#8b97a8;letter-spacing:.16em;text-transform:uppercase;margin-top:-10px}
  .dots{display:flex;gap:7px;margin-top:6px}
  .dots i{width:8px;height:8px;border-radius:50%;background:var(--acc);opacity:.35;animation:bd 1.1s ease-in-out infinite}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes bd{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
  .foot{position:fixed;bottom:16px;font-size:11px;color:#5c677a;letter-spacing:.08em}
</style></head><body>
  <div class="wrap">
    <svg class="mark" viewBox="0 0 132 132">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/>
        </linearGradient>
        <radialGradient id="sweepgrad" cx="66" cy="66" r="60" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
          <stop offset="1" stop-color="#22d3ee" stop-opacity="0.55"/>
        </radialGradient>
      </defs>
      <circle class="ring" cx="66" cy="66" r="58"/>
      <circle class="ring" cx="66" cy="66" r="40"/>
      <circle class="ring" cx="66" cy="66" r="22"/>
      <circle class="pulse" cx="66" cy="66" r="20"/>
      <g class="sweep-g"><path d="M66 66 L66 8 A58 58 0 0 1 120 52 Z" fill="url(#sweepgrad)"/></g>
      <path d="M66 30 L92 42 V66 C92 84 80 96 66 102 C52 96 40 84 40 66 V42 Z"
            fill="none" stroke="url(#g)" stroke-width="3.4" stroke-linejoin="round"/>
      <path d="M56 66 l7 8 l14 -17" fill="none" stroke="url(#g)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div style="text-align:center">
      <div class="brand">EventOS <b>ARC</b></div>
      <div class="sub">Central de Monitoreo</div>
    </div>
    <div class="dots"><i></i><i></i><i></i></div>
  </div>
  <div class="foot">Iniciando consola segura…</div>
</body></html>
