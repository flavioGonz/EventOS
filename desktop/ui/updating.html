<!doctype html><html lang="es"><head><meta charset="utf-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:;"/>
<style>
  :root{ --accent:#2f9bff; --accent-2:#5db4ff; --ink:#eef3fb; --ink-dim:#9aa8bf; --ink-faint:#5f6e86; --font:Inter,system-ui,"Segoe UI",Roboto,sans-serif; }
  *{margin:0;box-sizing:border-box;font-family:var(--font)}
  html,body{height:100%}
  body{background:linear-gradient(180deg,#141b2b,#0d1322);color:var(--ink);overflow:hidden;-webkit-app-region:drag;
    display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.08);border-radius:14px}
  .box{width:100%;padding:26px 30px;text-align:center}
  .logo{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 14px;border-radius:15px;color:#fff;
    background:linear-gradient(140deg,var(--accent),#6a7bff);box-shadow:0 10px 24px -8px rgba(47,155,255,.6)}
  .logo svg{width:26px;height:26px}
  h1{font-size:16px;font-weight:730;letter-spacing:-.01em}
  .ver{font-size:12px;color:var(--ink-faint);margin-top:3px}
  .phase{margin:16px 0 9px;font-size:13px;color:var(--ink-dim);min-height:18px}
  .bar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
  .fill{position:absolute;inset:0 auto 0 0;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .2s ease}
  .fill.indet{width:35%;animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{left:-35%}100%{left:100%}}
  .pct{margin-top:9px;font-size:12px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .sub{margin-top:4px;font-size:10.5px;color:var(--ink-faint)}
</style></head><body>
  <div class="box">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2.5 L20 5.5 V13.5 C20 18.6 16.7 21.6 12 22.9 C7.3 21.6 4 18.6 4 13.5 V5.5 Z"/><path d="M6.6 13.6 H10 L11.8 8.8 L14.8 18.6 L16.5 12.8 H18.4"/></svg></div>
    <h1>Actualizando EventOS ARC</h1>
    <div class="ver" id="ver"></div>
    <div class="phase" id="phase">Preparando la actualización…</div>
    <div class="bar"><div class="fill indet" id="fill"></div></div>
    <div class="pct" id="pct"></div>
    <div class="sub" id="sub"></div>
  </div>
<script>
  const $=(id)=>document.getElementById(id);
  const fmtMB=(b)=> (b/1048576).toFixed(1)+' MB';
  window.__ver=(v)=>{ $('ver').textContent = 'Versión '+v; };
  window.__progress=(pct,recv,total)=>{
    const f=$('fill');
    if(pct==null){ f.classList.add('indet'); $('pct').textContent=''; if(recv)$('sub').textContent=fmtMB(recv); return; }
    f.classList.remove('indet'); f.style.width=Math.max(2,Math.min(100,pct))+'%';
    $('pct').textContent=pct+'%';
    if(total)$('sub').textContent=fmtMB(recv)+' / '+fmtMB(total);
  };
  window.__phase=(name)=>{
    const map={download:'Descargando la actualización…',install:'Cerrando la consola y aplicando la actualización…',done:'Listo. Reabriendo la consola…',error:'No se pudo completar la actualización.'};
    $('phase').textContent = map[name] || name;
    if(name==='install'){ const f=$('fill'); f.classList.remove('indet'); f.style.width='100%'; $('pct').textContent=''; $('sub').textContent='No cierres esta ventana; el instalador continúa solo.'; }
  };
</script></body></html>
